<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="逐字保存的公开对话收藏">
  <title>Dialogue Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <header class="brand">
        <div class="mark" aria-hidden="true"><span></span><span></span></div>
        <div><h1>Dialogue Vault</h1><p>逐字对话收藏</p></div>
      </header>
      <div class="collection-meta"><strong id="total">0</strong><span>篇公开归档</span></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索标题与正文" autocomplete="off"></label>
      <nav id="list" aria-label="对话列表"></nav>
      <footer class="side-footer">原文存储 · 可验证哈希</footer>
    </aside>
    <main id="reader" class="reader">
      <div class="empty">正在载入归档…</div>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
